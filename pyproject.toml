[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyMyweblog"
version = "1.0.0"
description = "A Python library for interacting with the MyWebLog API"
readme = "README.md"
authors = [{ name = "Marcus Karlsson", email = "marcus.karlsson@usa.net" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.8.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/faanskit/pyMyweblog"
Repository = "https://github.com/faanskit/pyMyweblog"
Issues = "https://github.com/faanskit/pyMyweblog/issues"

[dependency-groups]
dev = [
    "pytest",
    "black>=24.8.0",
    "flake8>=5.0.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black>=24.8.0",
    "flake8>=5.0.4",
    "python-dotenv>=1.0.1",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]

[tool.setuptools.packages.find]
include = ["pyMyweblog*"]
