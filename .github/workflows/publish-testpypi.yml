name: Lint/Test and Publish to TestPyPI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Autoformat code with black
        run: black --check .

      - name: Run flake8
        run: flake8 .

      - name: Run tests
        run: pytest --ignore=scripts/booking_cli.py --ignore=scripts/myweblog.py tests/

  publish-testpypi:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[dev-release]')) ||
      (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[dev-release]') || contains(github.event.pull_request.title, '[testpypi]')))
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
